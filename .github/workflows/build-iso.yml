name: Build installer ISO

on:
  push:
    branches: [main]
    paths: [".github/workflows/build-iso.yml"]
  workflow_dispatch:
    inputs:
      variant:
        description: NVIDIA driver family
        required: true
        default: open
        type: choice
        options: [open, legacy]

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true
      - name: Resolve image and installer configuration
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          variant="${{ inputs.variant || 'open' }}"
          image="ghcr.io/${owner}/arcadelite-os-${variant}:latest"
          sed "s#localhost/arcadelite-os:latest#${image}#" disk_config/iso.toml > disk_config/iso.generated.toml
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "USER_UID=$(id -u)" >> "${GITHUB_ENV}"
          echo "USER_GID=$(id -g)" >> "${GITHUB_ENV}"
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Anaconda ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso.generated.toml
          image: ${{ env.IMAGE }}
          types: anaconda-iso
          rootfs: btrfs
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          additional-args: --use-librepo=True
      - name: Upload ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcadelite-${{ inputs.variant || 'open' }}-installer
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

